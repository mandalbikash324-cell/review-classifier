[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true

[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F6F8FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
linkColor = "#4F46E5"
borderColor = "#DFE5EF"
codeBackgroundColor = "#F0F3F9"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "large"
buttonRadius = "large"
showWidgetBorder = true
showSidebarBorder = true
greenColor = "#15803D"
blueColor = "#4F46E5"
violetColor = "#6D28D9"
orangeColor = "#C2410C"
redColor = "#B42318"
